<!-- ============================================================
  LINE CHART CARD — drop-in component (v4)
  Card: 216px tall, 16px padding, 328px base width (expands)
  Structure: BASE (shared) + PERIODS (day/week/month) merged by
  setPeriod(key) into the active CONFIG. Default period: "day".
  Segmented D/W/M control is DEV-ONLY: hidden in production.
  Show it with data-dev on .lc-card, or by loading the page
  with ?dev=1. In production, switch periods via the public
  API: hrLineChart.setPeriod("day" | "week" | "month").
  End pills (sleep/wake time chips behind first + last x-tick,
  day period only) are toggled by data-end-pills="true|false"
  on .lc-card. Default "false" = plain labels, no pill fills.
  Scrub: plot dims to dark; only dot + dashed line stay lit.
  Header readout shows scrubbed value + formatX(x) timestamp.
  Fonts: Google Sans Flex (text) · League Spartan (numbers)

  NOTE: draw()/scrub logic here is intentionally parallel to
  bar-chart.html (same tokens, scales, header, segmented control).
  If you move to a build system, extract the shared parts into a
  chart-core module — kept inline so each file stays drop-in.
============================================================= -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:wght@400;500&family=League+Spartan:wght@500;600;700&display=swap" rel="stylesheet">

<style>
  .lc-card {
    /* ---------- design tokens ---------- */
    --neutral-800: #10111A;      /* card background */
    --text-primary: #F0F1F8;
    --text-secondary: #7C809A;
    --gridline: #1C1E28;
    --accent: #D24963;           /* line red */
    --pill-bg: #292B38;
    --pill-text: #B9BDD1;
    --font-text: "Google Sans Flex", "Google Sans", system-ui, sans-serif;
    --font-number: "League Spartan", system-ui, sans-serif;
    --radius: 20px;
    --pad: 16px;
    --card-height: 216px;
    --card-min-width: 328px;     /* base phone width; chart expands with container */

    background: var(--neutral-800);
    border-radius: var(--radius);
    padding: var(--pad);
    box-sizing: border-box;
    width: 100%;
    min-width: var(--card-min-width);
    height: var(--card-height);
    display: flex;
    flex-direction: column;
    font-family: var(--font-text);
    -webkit-font-smoothing: antialiased;
  }
  .lc-card *, .lc-card *::before, .lc-card *::after { box-sizing: border-box; }

  /* ---------- header (auto layout: three blocks spread with screen width) ---------- */
  .lc-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; flex: none; }
  .lc-title {
    font: 500 15px/1.3 var(--font-text);
    color: var(--text-primary);
    margin: 0;
  }
  .lc-value-block { text-align: right; }
  .lc-value-row { display: flex; align-items: baseline; gap: 4px; justify-content: flex-end; }
  .lc-value {
    font: 700 20px/1 var(--font-number);
    color: var(--text-primary);
    letter-spacing: 0.01em;
  }
  .lc-unit {
    font: 500 11px/1 var(--font-text);
    color: var(--text-secondary);
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }
  .lc-sublabel {
    font: 500 11px/1.4 var(--font-text);
    color: var(--text-secondary);
    margin-top: 3px;
  }
  .lc-sublabel.scrubbing { font-family: var(--font-number); }

  /* ---------- segmented period control — DEV ONLY ----------
     Hidden in production. Visible only when .lc-card has the
     data-dev attribute (added automatically when URL has ?dev=1). */
  .lc-seg { display: none; }
  .lc-card[data-dev] .lc-seg {
    display: flex;
    background: var(--pill-bg);
    border-radius: 10px;         /* pill radius family */
    padding: 2px;
    height: 22px;
    flex: none;
  }
  .lc-seg button {
    border: 0;
    background: transparent;
    color: var(--pill-text);
    font: 600 11px/1 var(--font-number);
    padding: 0 8px;
    border-radius: 8px;
    cursor: pointer;
  }
  .lc-seg button.active { color: var(--text-primary); }

  /* ---------- chart ---------- */
  .lc-chart-wrap { position: relative; flex: 1; min-height: 0; margin-top: 14px; }
  .lc-chart-wrap svg { display: block; width: 100%; height: 100%; touch-action: none; }
  .lc-gridline { stroke: var(--gridline); stroke-width: 1; }
  .lc-y-label, .lc-x-label {
    font: 500 11px var(--font-number);
    fill: var(--text-secondary);
  }
  .lc-x-pill-bg { fill: var(--pill-bg); }
  .lc-x-pill-label { font: 500 11px var(--font-number); fill: var(--pill-text); }
  .lc-line { fill: none; stroke: var(--accent); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
  .lc-line.dotted { stroke-dasharray: 0.1 6; }   /* round caps render dashes as dots */
  .lc-plot { transition: opacity 140ms ease; }
  .lc-plot.dim { opacity: 0.28; }                /* scrub state: plot falls to dark */
  .lc-hover-line { stroke: var(--text-secondary); stroke-width: 1; stroke-dasharray: 3 3; opacity: 0; }
  .lc-hover-dot { fill: var(--accent); stroke: var(--text-primary); stroke-width: 1.5; opacity: 0; }
  @media (prefers-reduced-motion: reduce) {
    .lc-plot { transition: none; }
  }
</style>

<!-- data-end-pills: "true" = sleep-page variant (time pills behind first/last
     x-tick, day period only) · "false" = default, plain labels everywhere -->
<div class="lc-card" id="hr-line-card" data-end-pills="false">
  <div class="lc-header">
    <h3 class="lc-title">Heart Rate</h3>
    <div class="lc-seg" data-role="seg" role="tablist" aria-label="Period">
      <button data-period="day" role="tab">D</button>
      <button data-period="week" role="tab">W</button>
      <button data-period="month" role="tab">M</button>
    </div>
    <div class="lc-value-block">
      <div class="lc-value-row">
        <span class="lc-value" data-role="value">83</span>
        <span class="lc-unit" data-role="unit">BPM</span>
      </div>
      <div class="lc-sublabel" data-role="sublabel">Average</div>
    </div>
  </div>
  <div class="lc-chart-wrap" data-role="wrap">
    <svg data-role="svg" role="img" aria-label="Heart rate line chart"></svg>
  </div>
</div>

<script>
var hrLineChart = (function () {
  /* ================= BASE — shared across all periods ================= */
  var BASE = {
    unit: "BPM",
    yTicks: [40, 60, 80, 100],   // 4 lines, 40 → 100
    yMin: 40, yMax: 100,
    yAxisWidth: 34,              // right-side label gutter
    xAxisHeight: 26,             // pill row height
    topPad: 10,                  // space above top gridline so its label never clips
    xTickFrameWidth: 50          // every x value sits in an equal-width frame
  };

  /* ================= PERIODS — everything period-specific =================
     Each period: xMin/xMax (generic domain), xTicks [{label, pill?}],
     data [{x, value, dotted?}], restingValue/restingSublabel, formatX(x).
     All data below is SAMPLE DATA — replace with real series.            */
  var DAY_NAMES = ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"];

  var PERIODS = {
    day: {
      xMin: 23 * 60 + 54,                 // 11:54 PM, in minutes
      xMax: 24 * 60 + 7 * 60 + 28,        // 7:28 AM next day
      xTicks: [
        { label: "11:54" },
        { label: "2:00" },
        { label: "4:00" },
        { label: "6:00" },
        { label: "7:28" }
      ],
      restingValue: "83",
      restingSublabel: "10% lower than yesterday",
      formatX: function (x) {             // minutes → "h:mm AM/PM"
        var m = Math.round(x) % (24 * 60);
        var h = Math.floor(m / 60), mm = m % 60;
        var ap = h >= 12 ? "PM" : "AM";
        var h12 = h % 12; if (h12 === 0) h12 = 12;
        return h12 + ":" + (mm < 10 ? "0" : "") + mm + " " + ap;
      },
      data: sampleDay()
    },
    week: {
      xMin: 0, xMax: 7,                   // day index across the week
      xTicks: [
        { label: "M" }, { label: "T" }, { label: "W" }, { label: "T" },
        { label: "F" }, { label: "S" }, { label: "S" }
      ],
      restingValue: "82",
      restingSublabel: "Weekly average",
      formatX: function (x) {
        return DAY_NAMES[Math.min(6, Math.max(0, Math.floor(x)))];
      },
      data: sampleWeek()
    },
    month: {
      xMin: 1, xMax: 30,                  // day of month
      xTicks: [
        { label: "1" }, { label: "8" }, { label: "15" },
        { label: "22" }, { label: "30" }
      ],
      restingValue: "84",
      restingSublabel: "Monthly average",
      formatX: function (x) { return "Jul " + Math.round(x); },
      data: sampleMonth()
    }
  };

  /* ---------- sample data generators (replace with real data) ---------- */
  function sampleDay() {   // smooth overnight curve, gentle jitter
    var pts = [], xMin = 23 * 60 + 54, xMax = 24 * 60 + 7 * 60 + 28;
    var n = 90, seed = 7;
    function rnd() { seed = (seed * 16807) % 2147483647; return seed / 2147483647; }
    for (var i = 0; i < n; i++) {
      var t = i / (n - 1);
      var base = 76
        + 6 * Math.exp(-Math.pow((t - 0.18) / 0.14, 2))
        - 3 * Math.exp(-Math.pow((t - 0.42) / 0.12, 2))
        + 19 * Math.exp(-Math.pow((t - 0.78) / 0.15, 2))
        - 6 * Math.exp(-Math.pow((t - 1.0) / 0.07, 2))
        + 1.5 * Math.sin(t * 19);                       // slow physiological drift
      pts.push({ x: xMin + t * (xMax - xMin), value: base + (rnd() - 0.5) * 1.6 });
    }
    return pts;
  }
  function sampleWeek() {  // 8 readings/day; one dotted stretch = sensor gap
    var pts = [], n = 56, seed = 21;
    function rnd() { seed = (seed * 16807) % 2147483647; return seed / 2147483647; }
    for (var i = 0; i < n; i++) {
      var t = i / (n - 1), day = t * 7;
      var base = 80
        + 7 * Math.sin(day * Math.PI / 1.05)            // daily rhythm
        - 4 * Math.exp(-Math.pow((day - 5.6) / 0.9, 2)) // calmer weekend
        + 2 * Math.sin(day * 2.3);
      var pt = { x: day, value: base + (rnd() - 0.5) * 2 };
      if (i > 24 && i < 30) pt.dotted = true;           // sample sensor gap (Wed night)
      pts.push(pt);
    }
    return pts;
  }
  function sampleMonth() { // one point per day
    var vals = [78,80,83,79,76,84,88,85,81,77,82,86,90,87,83,79,75,80,85,89,92,88,84,80,77,81,86,90,86,82];
    return vals.map(function (v, i) { return { x: i + 1, value: v }; });
  }

  /* ================= state + elements ================= */
  var CONFIG = null;
  var root = document.getElementById("hr-line-card");
  var wrap = root.querySelector('[data-role="wrap"]');
  var svg = root.querySelector('[data-role="svg"]');
  var valueEl = root.querySelector('[data-role="value"]');
  var sublabelEl = root.querySelector('[data-role="sublabel"]');
  var segEl = root.querySelector('[data-role="seg"]');
  var NS = "http://www.w3.org/2000/svg";
  var geom = null;

  /* dev mode: ?dev=1 in the URL reveals the D/W/M control */
  if (/[?&]dev=1(&|$)/.test(location.search)) root.setAttribute("data-dev", "");

  /* end-pills variant: read once from the HTML attribute (true/false) */
  var END_PILLS = root.getAttribute("data-end-pills") === "true";

  function el(name, attrs, parent) {
    var e = document.createElementNS(NS, name);
    for (var k in attrs) e.setAttribute(k, attrs[k]);
    (parent || svg).appendChild(e);
    return e;
  }

  /* ================= rendering ================= */
  function draw() {
    var W = wrap.clientWidth, H = wrap.clientHeight;
    if (!CONFIG || W < 40 || H < 40) return;
    var plotW = W - CONFIG.yAxisWidth;
    var plotH = H - CONFIG.xAxisHeight;
    svg.setAttribute("viewBox", "0 0 " + W + " " + H);
    while (svg.firstChild) svg.removeChild(svg.firstChild);

    var x = function (v) {
      return ((v - CONFIG.xMin) / (CONFIG.xMax - CONFIG.xMin)) * plotW;
    };
    var y = function (v) {
      return plotH - ((v - CONFIG.yMin) / (CONFIG.yMax - CONFIG.yMin)) * (plotH - CONFIG.topPad);
    };

    /* gradient fill under the line */
    var defs = el("defs", {});
    var grad = el("linearGradient", { id: "lc-fill", x1: 0, y1: 0, x2: 0, y2: 1 }, defs);
    el("stop", { offset: "0%", "stop-color": "#D24963", "stop-opacity": 0.30 }, grad);
    el("stop", { offset: "100%", "stop-color": "#D24963", "stop-opacity": 0 }, grad);

    /* y-axis: 4 lines, 40 at the bottom — gridlines + right-side labels */
    CONFIG.yTicks.forEach(function (t) {
      el("line", { class: "lc-gridline", x1: 0, x2: plotW, y1: y(t), y2: y(t) });
      var lbl = el("text", { class: "lc-y-label", x: W - 2, y: y(t) + 4, "text-anchor": "end" });
      lbl.textContent = t;
    });

    /* plot group (dims as one unit during scrub) */
    var plot = el("g", { class: "lc-plot" });

    /* smooth line: Catmull-Rom → cubic bézier segments */
    var pts = CONFIG.data.map(function (p) {
      return { px: x(p.x), py: y(p.value), dotted: !!p.dotted };
    });
    function seg(i) {   // bézier command for pts[i] → pts[i+1]
      var p0 = pts[Math.max(i - 1, 0)], p1 = pts[i],
          p2 = pts[i + 1], p3 = pts[Math.min(i + 2, pts.length - 1)];
      var c1x = p1.px + (p2.px - p0.px) / 6, c1y = p1.py + (p2.py - p0.py) / 6;
      var c2x = p2.px - (p3.px - p1.px) / 6, c2y = p2.py - (p3.py - p1.py) / 6;
      return "C" + c1x.toFixed(1) + " " + c1y.toFixed(1) + " "
                 + c2x.toFixed(1) + " " + c2y.toFixed(1) + " "
                 + p2.px.toFixed(1) + " " + p2.py.toFixed(1);
    }

    /* continuous area fill */
    var full = "M" + pts[0].px.toFixed(1) + " " + pts[0].py.toFixed(1);
    for (var i = 0; i < pts.length - 1; i++) full += seg(i);
    var area = full
      + "L" + pts[pts.length - 1].px.toFixed(1) + " " + plotH
      + "L" + pts[0].px.toFixed(1) + " " + plotH + "Z";
    el("path", { d: area, fill: "url(#lc-fill)" }, plot);

    /* line split into solid/dotted runs (a point flagged dotted = segment into it) */
    var cur = null, runs = [];
    for (var j = 0; j < pts.length - 1; j++) {
      var dotted = pts[j + 1].dotted;
      if (!cur || cur.dotted !== dotted) {
        if (cur) runs.push(cur);
        cur = { dotted: dotted, d: "M" + pts[j].px.toFixed(1) + " " + pts[j].py.toFixed(1) };
      }
      cur.d += seg(j);
    }
    if (cur) runs.push(cur);
    runs.forEach(function (r) {
      el("path", { class: "lc-line" + (r.dotted ? " dotted" : ""), d: r.d }, plot);
    });

    /* x-axis labels — each value in an equal-width frame, uniformly spaced */
    var fw = CONFIG.xTickFrameWidth, pillH = 20, nT = CONFIG.xTicks.length;
    var pillTop = plotH + (CONFIG.xAxisHeight - pillH) / 2 + 2;
    var baseline = pillTop + pillH / 2 + 4;
    CONFIG.xTicks.forEach(function (t, i) {
      var cx = fw / 2 + (nT > 1 ? i * (plotW - fw) / (nT - 1) : plotW / 2 - fw / 2);
      /* end-pills variant: sleep/wake time chips behind first + last tick,
         day period only, and only when data-end-pills="true" on the card */
      var isPill = END_PILLS && CONFIG.periodKey === "day" && (i === 0 || i === nT - 1);
      if (isPill) {
        el("rect", {
          class: "lc-x-pill-bg", x: cx - fw / 2, y: pillTop,
          width: fw, height: pillH, rx: pillH / 2
        });
      }
      var l = el("text", {
        class: isPill ? "lc-x-pill-label" : "lc-x-label",
        x: cx, y: baseline, "text-anchor": "middle"
      });
      l.textContent = t.label;
    });

    /* scrub affordances — outside the plot group so they stay lit */
    var hoverLine = el("line", { class: "lc-hover-line", y1: CONFIG.topPad, y2: plotH, x1: 0, x2: 0 });
    var hoverDot = el("circle", { class: "lc-hover-dot", r: 4 });

    geom = { x: x, y: y, plotW: plotW, plotH: plotH,
             plot: plot, hoverLine: hoverLine, hoverDot: hoverDot };
  }

  /* ================= scrub → header readout ================= */
  function nearest(xv) {
    var best = CONFIG.data[0], bd = Infinity;
    CONFIG.data.forEach(function (p) {
      var d = Math.abs(p.x - xv);
      if (d < bd) { bd = d; best = p; }
    });
    return best;
  }

  function onScrub(evt) {
    if (!geom) return;
    var rect = svg.getBoundingClientRect();
    var px = (evt.touches ? evt.touches[0].clientX : evt.clientX) - rect.left;
    if (px < 0 || px > geom.plotW) { onRelease(); return; }
    var xv = CONFIG.xMin + (px / geom.plotW) * (CONFIG.xMax - CONFIG.xMin);
    var p = nearest(xv);
    var cx = geom.x(p.x), cy = geom.y(p.value);

    geom.plot.classList.add("dim");                 /* plot falls dark */
    geom.hoverLine.setAttribute("x1", cx);
    geom.hoverLine.setAttribute("x2", cx);
    geom.hoverLine.style.opacity = 1;
    geom.hoverDot.setAttribute("cx", cx);
    geom.hoverDot.setAttribute("cy", cy);
    geom.hoverDot.style.opacity = 1;

    valueEl.textContent = Math.round(p.value);
    sublabelEl.textContent = CONFIG.formatX(p.x);
    sublabelEl.classList.add("scrubbing");
  }

  function onRelease() {
    if (!geom) return;
    geom.plot.classList.remove("dim");
    geom.hoverLine.style.opacity = 0;
    geom.hoverDot.style.opacity = 0;
    valueEl.textContent = CONFIG.restingValue;
    sublabelEl.textContent = CONFIG.restingSublabel;
    sublabelEl.classList.remove("scrubbing");
  }

  svg.addEventListener("pointermove", onScrub);
  svg.addEventListener("pointerdown", onScrub);
  svg.addEventListener("pointerleave", onRelease);
  svg.addEventListener("pointerup", onRelease);

  /* ================= period switching ================= */
  function setPeriod(key) {
    if (!PERIODS[key]) return;
    CONFIG = Object.assign({}, BASE, PERIODS[key]);
    CONFIG.periodKey = key;
    segEl.querySelectorAll("button").forEach(function (b) {
      b.classList.toggle("active", b.dataset.period === key);
      b.setAttribute("aria-selected", b.dataset.period === key);
    });
    valueEl.textContent = CONFIG.restingValue;
    sublabelEl.textContent = CONFIG.restingSublabel;
    sublabelEl.classList.remove("scrubbing");
    draw();
  }

  segEl.addEventListener("click", function (e) {
    var b = e.target.closest("button");
    if (b) setPeriod(b.dataset.period);
  });

  /* responsive redraw */
  if (typeof ResizeObserver !== "undefined") {
    new ResizeObserver(function () { draw(); }).observe(wrap);
  } else {
    window.addEventListener("resize", draw);
  }

  setPeriod("day");   /* default */

  /* public API */
  return {
    setPeriod: setPeriod,
    setData: function (period, data) {   /* hrLineChart.setData("week", [{x, value}...]) */
      if (!PERIODS[period]) return;
      PERIODS[period].data = data;
      if (CONFIG && CONFIG.periodKey === period) setPeriod(period);
    }
  };
})();
</script>
