<!-- ============================================================
  BAR CHART CARD — drop-in component (v4)
  Card: 216px tall, 16px padding, 328px base width (expands)
  Structure: BASE (shared) + PERIODS (day/week/month) merged by
  setPeriod(key) into the active CONFIG. Default period: "day".
  Segmented D/W/M control in the header switches periods.
  Dev-only control: hidden by default; shown when the card has a
  data-dev attribute, added automatically when the URL contains
  ?dev=1 (or &dev=1). Production switching: hrBarChart.setPeriod().
  End-pills variant: data-end-pills="true" = sleep-page variant
  (time chips behind first/last x-tick, day period only);
  "false" = plain labels.
  Bars: solid fill, slim (30% of slot), grow from the 40 floor.
  Scrub: other bars dim; a dotted white line runs from the top of
  the hovered bar to the top of the chart; header shows value +
  formatX(x) timestamp.
  Fonts: Google Sans Flex (text) · League Spartan (numbers)

  NOTE: draw()/scrub logic here is intentionally parallel to
  line-chart.html (same tokens, scales, header, segmented control).
  If you move to a build system, extract the shared parts into a
  chart-core module — kept inline so each file stays drop-in.
============================================================= -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:wght@400;500&family=League+Spartan:wght@500;600;700&display=swap" rel="stylesheet">

<style>
  .bc-card {
    /* ---------- design tokens ---------- */
    --neutral-800: #10111A;      /* card background */
    --text-primary: #F0F1F8;
    --text-secondary: #7C809A;
    --gridline: #1C1E28;
    --accent: #D24963;           /* solid bar fill */
    --pill-bg: #292B38;
    --pill-text: #B9BDD1;
    --font-text: "Google Sans Flex", "Google Sans", system-ui, sans-serif;
    --font-number: "League Spartan", system-ui, sans-serif;
    --radius: 20px;
    --pad: 16px;
    --card-height: 216px;
    --card-min-width: 328px;     /* base phone width; chart expands with container */

    background: var(--neutral-800);
    border-radius: var(--radius);
    padding: var(--pad);
    box-sizing: border-box;
    width: 100%;
    min-width: var(--card-min-width);
    height: var(--card-height);
    display: flex;
    flex-direction: column;
    font-family: var(--font-text);
    -webkit-font-smoothing: antialiased;
  }
  .bc-card *, .bc-card *::before, .bc-card *::after { box-sizing: border-box; }

  /* ---------- header (auto layout: three blocks spread with screen width) ---------- */
  .bc-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; flex: none; }
  .bc-title {
    font: 500 15px/1.3 var(--font-text);
    color: var(--text-primary);
    margin: 0;
  }
  .bc-value-block { text-align: right; }
  .bc-value-row { display: flex; align-items: baseline; gap: 4px; justify-content: flex-end; }
  .bc-value {
    font: 700 20px/1 var(--font-number);
    color: var(--text-primary);
    letter-spacing: 0.01em;
  }
  .bc-unit {
    font: 500 11px/1 var(--font-text);
    color: var(--text-secondary);
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }
  .bc-sublabel {
    font: 500 11px/1.4 var(--font-text);
    color: var(--text-secondary);
    margin-top: 3px;
  }
  .bc-sublabel.scrubbing { font-family: var(--font-number); }

  /* ---------- segmented period control (existing tokens only) ---------- */
  .bc-seg {
    display: none;               /* dev-only: shown via data-dev on the card */
    background: var(--pill-bg);
    border-radius: 10px;         /* pill radius family */
    padding: 2px;
    height: 22px;
    flex: none;
  }
  .bc-seg button {
    border: 0;
    background: transparent;
    color: var(--pill-text);
    font: 600 11px/1 var(--font-number);
    padding: 0 8px;
    border-radius: 8px;
    cursor: pointer;
  }
  .bc-seg button.active { color: var(--text-primary); }
  .bc-card[data-dev] .bc-seg { display: flex; }

  /* ---------- chart ---------- */
  .bc-chart-wrap { position: relative; flex: 1; min-height: 0; margin-top: 14px; }
  .bc-chart-wrap svg { display: block; width: 100%; height: 100%; touch-action: none; }
  .bc-gridline { stroke: var(--gridline); stroke-width: 1; }
  .bc-y-label, .bc-x-label {
    font: 500 11px var(--font-number);
    fill: var(--text-secondary);
  }
  .bc-x-pill-bg { fill: var(--pill-bg); }
  .bc-x-pill-label { font: 500 11px var(--font-number); fill: var(--pill-text); }
  .bc-bar { fill: var(--accent); transition: opacity 120ms ease; cursor: pointer; }
  .bc-bar.dim { opacity: 0.4; }
  .bc-hover-line {                               /* dotted white line, bar top → chart top */
    stroke: var(--text-primary);
    stroke-width: 1.5;
    stroke-linecap: round;
    stroke-dasharray: 0.1 5;                     /* round caps render dashes as dots */
    opacity: 0;
  }
  @media (prefers-reduced-motion: reduce) {
    .bc-bar { transition: none; }
  }
</style>

<!-- data-end-pills: "true" = sleep-page variant (time chips behind
     first/last x-tick, day period only); "false" = plain labels -->
<div class="bc-card" id="hr-bar-card" data-end-pills="false">
  <div class="bc-header">
    <h3 class="bc-title">Heart Rate</h3>
    <div class="bc-seg" data-role="seg" role="tablist" aria-label="Period">
      <button data-period="day" role="tab">D</button>
      <button data-period="week" role="tab">W</button>
      <button data-period="month" role="tab">M</button>
    </div>
    <div class="bc-value-block">
      <div class="bc-value-row">
        <span class="bc-value" data-role="value">83</span>
        <span class="bc-unit" data-role="unit">BPM</span>
      </div>
      <div class="bc-sublabel" data-role="sublabel">Hourly average</div>
    </div>
  </div>
  <div class="bc-chart-wrap" data-role="wrap">
    <svg data-role="svg" role="img" aria-label="Average heart rate bar chart"></svg>
  </div>
</div>

<script>
var hrBarChart = (function () {
  /* ================= BASE — shared across all periods ================= */
  var BASE = {
    unit: "BPM",
    yTicks: [40, 60, 80, 100],   // 4 lines, 40 → 100
    yMin: 40, yMax: 100,
    yAxisWidth: 34,              // right-side label gutter
    xAxisHeight: 22,
    topPad: 10,                  // space above top gridline so its label never clips
    barRadius: 3,
    barWidthRatio: 0.3,          // slim bars: 30% of each slot
    xTickFrameWidth: 50          // pill frame width (end-pills variant only)
  };

  /* ================= PERIODS — everything period-specific =================
     Each period: xMin/xMax (generic domain), xTicks [{x, label, pill?}]
     (positioned under the bar whose data point has that x), data
     [{x, value}], restingValue/restingSublabel, formatX(x).
     All data below is SAMPLE DATA — replace with real series.            */
  var DAY_NAMES = ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday", "Sunday"];

  function fmtHour(h) {
    var ap = h >= 12 ? "PM" : "AM";
    var h12 = h % 12; if (h12 === 0) h12 = 12;
    return h12 + ":00 " + ap;
  }

  var PERIODS = {
    day: {   /* 12 bars, one per 2-hour block; x = starting hour */
      xMin: 0, xMax: 22,
      xTicks: [
        { x: 0, label: "12" }, { x: 2, label: "2" }, { x: 4, label: "4" },
        { x: 6, label: "6" }, { x: 8, label: "8" }, { x: 10, label: "10" },
        { x: 12, label: "12" }, { x: 14, label: "2" }, { x: 16, label: "4" },
        { x: 18, label: "6" }, { x: 20, label: "8" }, { x: 22, label: "10" }
      ],
      restingValue: "85",
      restingSublabel: "Hourly average",
      formatX: fmtHour,
      data: [78, 80, 76, 88, 95, 84, 90, 86, 92, 97, 82, 74]
        .map(function (v, i) { return { x: i * 2, value: v }; })
    },
    week: {  /* 7 bars, one per day; x = day index */
      xMin: 0, xMax: 6,
      xTicks: [
        { x: 0, label: "M" }, { x: 1, label: "T" }, { x: 2, label: "W" },
        { x: 3, label: "T" }, { x: 4, label: "F" }, { x: 5, label: "S" },
        { x: 6, label: "S" }
      ],
      restingValue: "82",
      restingSublabel: "Daily average",
      formatX: function (x) { return DAY_NAMES[Math.min(6, Math.max(0, Math.round(x)))]; },
      data: [81, 84, 79, 88, 92, 76, 73]
        .map(function (v, i) { return { x: i, value: v }; })
    },
    month: { /* 30 bars, one per day of month; labels only on some days */
      xMin: 1, xMax: 30,
      xTicks: [
        { x: 1, label: "1" }, { x: 8, label: "8" }, { x: 15, label: "15" },
        { x: 22, label: "22" }, { x: 29, label: "29" }
      ],
      restingValue: "83",
      restingSublabel: "Daily average",
      formatX: function (x) { return "Jul " + Math.round(x); },
      data: [72,78,84,80,76,88,91,83,79,74,86,90,95,81,77,73,85,89,92,84,78,75,82,87,93,86,80,76,83,88]
        .map(function (v, i) { return { x: i + 1, value: v }; })
    }
  };

  /* ================= state + elements ================= */
  var CONFIG = null;
  var root = document.getElementById("hr-bar-card");
  var END_PILLS = root.getAttribute("data-end-pills") === "true";
  var wrap = root.querySelector('[data-role="wrap"]');
  var svg = root.querySelector('[data-role="svg"]');
  var valueEl = root.querySelector('[data-role="value"]');
  var sublabelEl = root.querySelector('[data-role="sublabel"]');
  var segEl = root.querySelector('[data-role="seg"]');
  var NS = "http://www.w3.org/2000/svg";
  var bars = [];
  var hoverLine = null;
  var plotWCache = 0;

  function el(name, attrs, parent) {
    var e = document.createElementNS(NS, name);
    for (var k in attrs) e.setAttribute(k, attrs[k]);
    (parent || svg).appendChild(e);
    return e;
  }

  /* rounded-top-only rect path */
  function roundedTopRect(x, y, w, h, r) {
    r = Math.min(r, w / 2, h);
    return "M" + x + " " + (y + h)
         + "L" + x + " " + (y + r)
         + "Q" + x + " " + y + " " + (x + r) + " " + y
         + "L" + (x + w - r) + " " + y
         + "Q" + (x + w) + " " + y + " " + (x + w) + " " + (y + r)
         + "L" + (x + w) + " " + (y + h) + "Z";
  }

  /* ================= rendering ================= */
  function draw() {
    var W = wrap.clientWidth, H = wrap.clientHeight;
    if (!CONFIG || W < 40 || H < 40) return;
    var plotW = W - CONFIG.yAxisWidth;
    var plotH = H - CONFIG.xAxisHeight;
    plotWCache = plotW;
    svg.setAttribute("viewBox", "0 0 " + W + " " + H);
    while (svg.firstChild) svg.removeChild(svg.firstChild);
    bars = [];

    var y = function (v) {
      return plotH - ((v - CONFIG.yMin) / (CONFIG.yMax - CONFIG.yMin)) * (plotH - CONFIG.topPad);
    };

    /* y-axis: 4 lines, 40 at the bottom — gridlines + right-side labels */
    CONFIG.yTicks.forEach(function (t) {
      el("line", { class: "bc-gridline", x1: 0, x2: plotW, y1: y(t), y2: y(t) });
      var lbl = el("text", { class: "bc-y-label", x: W - 2, y: y(t) + 4, "text-anchor": "end" });
      lbl.textContent = t;
    });

    /* bars — slim, solid, centered in equal slots, growing from the 40 floor */
    var data = CONFIG.data;
    var n = data.length;
    var slot = plotW / n;
    var bw = slot * CONFIG.barWidthRatio;

    data.forEach(function (d, i) {
      var bx = i * slot + (slot - bw) / 2;
      var by = y(Math.max(d.value, CONFIG.yMin));
      var bar = el("path", {
        class: "bc-bar",
        d: roundedTopRect(bx, by, bw, Math.max(plotH - by, 0), CONFIG.barRadius)
      });
      bars.push({ node: bar, data: d, cx: bx + bw / 2, top: by });
    });

    /* x-axis labels — positioned under the bar whose data x matches */
    var nT = CONFIG.xTicks.length, fw = CONFIG.xTickFrameWidth, pillH = 20;
    var pillTop = plotH + (CONFIG.xAxisHeight - pillH) / 2;
    CONFIG.xTicks.forEach(function (t, i) {
      var idx = -1;
      for (var k = 0; k < data.length; k++) if (data[k].x === t.x) { idx = k; break; }
      if (idx < 0) return;
      var cx = idx * slot + slot / 2;
      var isPill = END_PILLS && CONFIG.periodKey === "day"
                   && (i === 0 || i === nT - 1);
      if (isPill) {
        var px = Math.min(Math.max(cx, fw / 2), plotW - fw / 2);
        el("rect", {
          class: "bc-x-pill-bg", x: px - fw / 2, y: pillTop,
          width: fw, height: pillH, rx: pillH / 2
        });
        cx = px;
      }
      var lbl = el("text", {
        class: isPill ? "bc-x-pill-label" : "bc-x-label",
        x: cx, y: plotH + 16, "text-anchor": "middle"
      });
      lbl.textContent = t.label;
    });

    /* dotted white line: hovered bar top → chart top (drawn last, hidden) */
    hoverLine = el("line", { class: "bc-hover-line", x1: 0, x2: 0, y1: 0, y2: CONFIG.topPad });
  }

  /* ================= scrub → header readout ================= */
  function highlight(index) {
    bars.forEach(function (b, i) {
      b.node.classList.toggle("dim", i !== index);
    });
    var b = bars[index];
    hoverLine.setAttribute("x1", b.cx);
    hoverLine.setAttribute("x2", b.cx);
    hoverLine.setAttribute("y1", b.top);
    hoverLine.setAttribute("y2", CONFIG.topPad);
    hoverLine.style.opacity = 1;

    valueEl.textContent = Math.round(b.data.value);
    sublabelEl.textContent = CONFIG.formatX(b.data.x);
    sublabelEl.classList.add("scrubbing");
  }

  function onRelease() {
    bars.forEach(function (b) { b.node.classList.remove("dim"); });
    if (hoverLine) hoverLine.style.opacity = 0;
    valueEl.textContent = CONFIG.restingValue;
    sublabelEl.textContent = CONFIG.restingSublabel;
    sublabelEl.classList.remove("scrubbing");
  }

  function onScrub(evt) {
    if (!bars.length) return;
    var rect = svg.getBoundingClientRect();
    var px = (evt.touches ? evt.touches[0].clientX : evt.clientX) - rect.left;
    if (px < 0 || px > plotWCache) { onRelease(); return; }
    var i = Math.min(bars.length - 1, Math.max(0, Math.floor(px / (plotWCache / bars.length))));
    highlight(i);
  }

  svg.addEventListener("pointermove", onScrub);
  svg.addEventListener("pointerdown", onScrub);
  svg.addEventListener("pointerleave", onRelease);
  svg.addEventListener("pointerup", onRelease);

  /* ================= period switching ================= */
  function setPeriod(key) {
    if (!PERIODS[key]) return;
    CONFIG = Object.assign({}, BASE, PERIODS[key]);
    CONFIG.periodKey = key;
    segEl.querySelectorAll("button").forEach(function (b) {
      b.classList.toggle("active", b.dataset.period === key);
      b.setAttribute("aria-selected", b.dataset.period === key);
    });
    valueEl.textContent = CONFIG.restingValue;
    sublabelEl.textContent = CONFIG.restingSublabel;
    sublabelEl.classList.remove("scrubbing");
    draw();
  }

  segEl.addEventListener("click", function (e) {
    var b = e.target.closest("button");
    if (b) setPeriod(b.dataset.period);
  });

  /* responsive redraw */
  if (typeof ResizeObserver !== "undefined") {
    new ResizeObserver(function () { draw(); }).observe(wrap);
  } else {
    window.addEventListener("resize", draw);
  }

  /* dev-only segmented control: visible only with ?dev=1 in the URL */
  if (/[?&]dev=1(&|$)/.test(location.search)) root.setAttribute("data-dev", "");

  setPeriod("day");   /* default */

  /* public API */
  return {
    setPeriod: setPeriod,
    setData: function (period, data) {   /* hrBarChart.setData("week", [{x, value}...]) */
      if (!PERIODS[period]) return;
      PERIODS[period].data = data;
      if (CONFIG && CONFIG.periodKey === period) setPeriod(period);
    }
  };
})();
</script>
