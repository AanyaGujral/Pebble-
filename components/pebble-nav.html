<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Pebble · navigation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* ---- tokens (subset) ---- */
  :root{
    color-scheme: dark;
    --neutral-0:   #EFF1F9;
    --neutral-100: #D5D9EA;
    --neutral-300: #999FB9;
    --neutral-800: #0F111B;
    --neutral-900: #07080C;
    --teal-400:    #45C7B3;
    --teal-600:    #1D8173;
    --metric-readiness: var(--teal-400);   /* the app's accent, as everywhere else */
    --surface-app:  var(--neutral-900);
    --surface-card: var(--neutral-800);
    --radius-full: 999px;
    --radius-20: 20px;
    --radius-24: 24px;
    --space-2: 2px;
    --space-8: 8px;
    --gutter: 16px;
    --font-text: 'Google Sans Flex','Google Sans','Inter',Arial,sans-serif;
  }

  *{ box-sizing: border-box; }
  body{
    margin: 0;
    min-height: 100vh;
    background: var(--surface-app);
    font-family: var(--font-text);
    display: flex;
    align-items: flex-end;
    justify-content: center;
  }

  /* ---- demo screen: content behind the bar so the blur has a job ---- */
  .screen{
    position: relative;
    width: 100%;
    max-width: 390px;
    min-height: 100vh;
    padding: 48px 24px 24px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    overflow: hidden;
  }
  .screen h1{
    margin: 0 0 4px;
    font-size: 24px;
    line-height: 30px;
    font-weight: 600;
    letter-spacing: -0.01em;
    color: var(--neutral-100);
  }
  .card{ height: 88px; border-radius: var(--radius-20); background: var(--surface-card); flex: none; }
  .card:nth-of-type(odd){  background-image: linear-gradient(100deg, rgba(138,124,236,.35), rgba(69,199,179,.12)); }
  .card:nth-of-type(even){ background-image: linear-gradient(100deg, rgba(228,58,98,.28), rgba(245,158,59,.12)); }
  .nav-slot{
    position: sticky;
    bottom: calc(24px + env(safe-area-inset-bottom, 0px));
    margin-top: auto;
    /* the demo screen pads 24px, but the dock sits on the 16px system gutter */
    margin-inline: calc(var(--gutter) - 24px);
    padding-top: 24px;
    display: flex;
    justify-content: center;
  }

  /* ---------------- navigation dock ----------------
     Two units centred on one axis, 8px apart, filling the 16px gutter exactly:
       nav pill  286 × 60   (tabs 63 × 60, 2px between, 14px side padding)
       AI unit    64 × 64   (your Figma frame; overhangs the pill 2px top
                             and bottom, as Whoop's does)
       286 + 8 + 64 = 358 = 390 − 2 × 16

     FLAG — consequences of making room for the AI unit, all in the nav pill,
     none a new token:
       · pill 328 → 286, tabs 72 → 63. The 64px frame took 4px more than the
         60 it replaced; this holds the 8px gap and the 16px gutter and takes
         the 4 from the pill. The alternatives are gap 8 → 4 (pill stays 290,
         tabs 64) or letting the dock run 362 wide on a 14px gutter (pill
         untouched). Say which.
       · gap between tabs 4px → 2px (--space-2), so the tab width lands on a
         whole pixel.
     Material is identical across both units — same fill, blur and shadow.
     Only the foreground differs: nav glyphs are neutral, the logomark is
     teal-400. ---------------- */
  .nav-dock{
    display: flex;
    align-items: center;
    gap: var(--space-8);
    width: 358px;
  }

  /* the surface both units share */
  .nav-dock > *{
    background: rgba(15, 17, 27, .8);            /* neutral 800 @ 80% */
    -webkit-backdrop-filter: blur(26px);          /* Figma background blur 52 */
    backdrop-filter: blur(26px);
    box-shadow: 0 8px 24px rgba(7,8,12,.48), 0 2px 6px rgba(7,8,12,.32);
  }

  .pebble-nav{
    display: flex;
    align-items: center;
    gap: var(--space-2);
    width: 286px;
    height: 60px;
    flex: none;
    padding: 0 14px;
    border-radius: var(--radius-full);
  }

  .pebble-tab{
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2px;
    width: 63px;
    height: 60px;
    padding: 10px 0;
    border: 0;
    background: none;
    border-radius: var(--radius-full);
    font-family: inherit;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .pebble-tab:focus-visible{ outline: 2px solid var(--neutral-0); outline-offset: -2px; }

  .pebble-tab .icon{
    display: block;
    height: 24px;
    color: var(--neutral-300);
    transition: color 160ms ease, transform 160ms ease;
  }
  .pebble-tab .label{
    font-size: 10px;
    line-height: 14px;
    font-weight: 400;
    letter-spacing: .01em;
    color: var(--neutral-300);
    transition: color 160ms ease;
  }
  .pebble-tab:active .icon{ transform: scale(.92); }

  /* selected: filled glyph at neutral 0, label at neutral 100 */
  .pebble-tab[aria-current="page"] .icon{  color: var(--neutral-0); }
  .pebble-tab[aria-current="page"] .label{ color: var(--neutral-100); }

  /* ---------------- AI chat unit ----------------
     Built to your Figma frame ("Fill + Shadow", 2026-09-20), then balanced
     against the pill in the round after:
       frame     64 × 64, radius 24 (was 20 — one system step up, toward the
                 pill's full round), clips its children
       logomark  28 × 28 (was 32), teal-400 — untouched
       glow 1    circle 36px, teal-600 fill, layer blur 80, at 60%
       glow 2    circle 20px, teal-600 fill, layer blur 20, at 60%
     Same surface, blur and shadow as the nav. It is an action, not a fifth
     tab: no label, no aria-current, and it sits outside <nav> so the primary
     nav stays four destinations.

     Figma → CSS: a Figma layer blur of N is a CSS filter blur of N/2 (the
     same conversion this file already uses for the nav's background blur,
     52 → 26). So 80 → 40px and 20 → 10px. The frame clips, as your render
     shows — the glow lives inside the square, nothing bleeds past the edge.
     The teal is dialled with opacity so the fill stays the teal-600 token
     rather than stepping to a darker ramp value.
     ---------------- */
  .pebble-ai{
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 64px;
    height: 64px;
    flex: none;
    padding: 0;
    border: 0;
    border-radius: var(--radius-24);
    overflow: hidden;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .pebble-ai::before,
  .pebble-ai::after{
    content: "";
    position: absolute;
    left: 50%; top: 50%;
    border-radius: 50%;
    background: var(--teal-600);
    opacity: .6;
    pointer-events: none;
  }
  /* glow 1 — 36px, blur 80 */
  .pebble-ai::before{
    width: 36px; height: 36px;
    margin: -18px 0 0 -18px;
    filter: blur(40px);
  }
  /* glow 2 — 20px, blur 20 */
  .pebble-ai::after{
    width: 20px; height: 20px;
    margin: -10px 0 0 -10px;
    filter: blur(10px);
  }
  .pebble-ai:focus-visible{ outline: 2px solid var(--neutral-0); outline-offset: -2px; }
  .pebble-ai .mark{
    position: relative;
    z-index: 1;
    display: block;
    width: 28px;
    height: 28px;
    color: var(--metric-readiness);
    transition: transform 160ms ease;
  }
  .pebble-ai:active .mark{ transform: scale(.92); }

  @media (prefers-reduced-motion: reduce){
    .pebble-tab .icon, .pebble-tab .label, .pebble-ai .mark{ transition: none; }
    .pebble-tab:active .icon, .pebble-ai:active .mark{ transform: none; }
  }
</style>
</head>
<body>

  <main class="screen">
    <h1 id="screen-title">Health</h1>
    <div class="card"></div>
    <div class="card"></div>
    <div class="card"></div>
    <div class="card"></div>

    <div class="nav-slot">
      <div class="nav-dock">
        <nav class="pebble-nav" aria-label="Primary"></nav>

        <!-- ============================================================
             Pebble logomark — the master vector, lifted from page 5 of
             Pebble_Brand Guidelines 2020.ai (section "02 Logomark") and
             normalised onto a 24 box. Curves are the artwork's own; not
             redrawn, per the guideline that the mark is never recreated.
             Natural aspect is 473.34 × 509.94 → 22.28 × 24, centred in
             the box; the box is drawn at 28px. fill-rule
             is nonzero, as the master artwork sets it.
             ============================================================ -->
        <button class="pebble-ai" type="button" aria-label="Pebble AI chat">
          <svg class="mark" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path fill="currentColor" fill-rule="nonzero" d="M 20.924 9.414 C 20.619 10.353 20.074 11.131 19.309 11.818 C 17.942 13.045 16.071 13.686 14.162 14.062 C 13.936 14.107 13.709 14.147 13.481 14.183 C 13.386 14.199 13.29 14.213 13.195 14.227 C 13.145 14.234 13.122 14.238 13.113 14.24 C 13.099 14.241 13.068 14.245 13.006 14.252 C 12.644 14.296 12.281 14.332 11.916 14.357 C 11.465 14.389 11.015 14.4 10.564 14.404 C 9.528 14.414 8.445 14.388 7.4 14.524 C 7.69 12.902 7.981 11.279 8.272 9.657 C 8.293 9.539 8.314 9.421 8.335 9.303 C 8.593 8.047 8.813 6.805 9.453 5.673 C 10.269 4.23 11.553 3.054 13.088 2.412 C 16.138 1.136 20.321 2.058 21.085 5.681 C 21.345 6.913 21.31 8.23 20.924 9.414 M 22.663 4.509 C 22.032 2.871 20.935 1.467 19.306 0.72 C 17.58 -0.072 15.587 -0.185 13.749 0.256 C 10.268 1.092 7.562 4 6.823 7.477 C 6.729 7.921 6.641 8.366 6.549 8.811 C 6.178 10.882 5.807 12.954 5.436 15.026 C 4.14 15.525 2.969 16.307 2.125 17.432 C 1.156 18.723 0.476 20.809 1.104 22.404 C 1.665 23.829 3.288 24.403 4.643 23.702 C 5.549 23.232 5.998 22.361 6.17 21.396 C 6.419 19.998 6.67 18.723 6.92 17.326 C 6.437 17.43 5.567 17.672 4.9 18.146 C 4.779 18.822 4.658 19.374 4.537 20.05 C 4.454 20.515 4.427 21.094 4.249 21.539 C 4.073 21.976 3.692 22.179 3.353 22.16 C 3.233 22.153 3.094 22.105 3.014 22.026 C 2.836 21.85 2.772 21.626 2.747 21.36 C 2.734 21.226 2.737 21.089 2.742 20.954 C 2.747 20.829 2.758 20.705 2.772 20.581 C 2.777 20.546 2.787 20.483 2.796 20.443 C 2.821 20.325 2.844 20.206 2.874 20.089 C 3.118 19.134 3.674 18.239 4.548 17.582 C 4.708 17.462 4.871 17.354 5.037 17.256 L 5.037 17.254 C 5.101 17.199 6.225 16.616 7.026 16.508 L 7.044 16.508 L 7.045 16.505 C 8.39 16.234 9.818 16.295 11.219 16.246 C 12.871 16.189 14.543 15.954 16.13 15.49 C 18.161 14.896 20.165 13.88 21.492 12.185 C 23.103 10.126 23.611 6.969 22.663 4.509"/>
          </svg>
        </button>
      </div>
    </div>
  </main>

<script>
  // Phosphor icons — regular (inactive) and fill (selected).
  const ICONS = {
    health: {
      regular: '<path fill="currentColor" d="M219.31,108.68l-80-80a16,16,0,0,0-22.62,0l-80,80A15.87,15.87,0,0,0,32,120v96a8,8,0,0,0,8,8h64a8,8,0,0,0,8-8V160h32v56a8,8,0,0,0,8,8h64a8,8,0,0,0,8-8V120A15.87,15.87,0,0,0,219.31,108.68ZM208,208H160V152a8,8,0,0,0-8-8H104a8,8,0,0,0-8,8v56H48V120l80-80,80,80Z"/>',
      fill:    '<path fill="currentColor" d="M224,120v96a8,8,0,0,1-8,8H160a8,8,0,0,1-8-8V164a4,4,0,0,0-4-4H108a4,4,0,0,0-4,4v52a8,8,0,0,1-8,8H40a8,8,0,0,1-8-8V120a16,16,0,0,1,4.69-11.31l80-80a16,16,0,0,1,22.62,0l80,80A16,16,0,0,1,224,120Z"/>'
    },
    activity: {
      regular: '<path fill="currentColor" d="M231.16,166.63l-28.63-14.31A47.74,47.74,0,0,1,176,109.39V80a8,8,0,0,0-8-8,48.05,48.05,0,0,1-48-48,8,8,0,0,0-12.83-6.37L30.13,76l-.2.16a16,16,0,0,0-1.24,23.75L142.4,213.66a8,8,0,0,0,5.66,2.34H224a16,16,0,0,0,16-16V180.94A15.92,15.92,0,0,0,231.16,166.63ZM224,200H151.37L40,88.63l12.87-9.76,38.79,38.79A8,8,0,0,0,103,106.34L65.74,69.11l40-30.31A64.15,64.15,0,0,0,160,87.5v21.89a63.65,63.65,0,0,0,35.38,57.24L224,180.94ZM70.8,184H32a8,8,0,0,1,0-16H70.8a8,8,0,1,1,0,16Zm40,24a8,8,0,0,1-8,8H48a8,8,0,0,1,0-16h54.8A8,8,0,0,1,110.8,208Z"/>',
      fill:    '<path fill="currentColor" d="M70.8,184H32a8,8,0,0,1,0-16H70.8a8,8,0,1,1,0,16Zm32,16H48a8,8,0,0,0,0,16h54.8a8,8,0,1,0,0-16Zm128.36-33.37-28.63-14.31A47.74,47.74,0,0,1,176,109.39V80a8,8,0,0,0-7.93-8A48.05,48.05,0,0,1,120,24.07a8,8,0,0,0-12.83-6.44L45.11,64.68a4,4,0,0,0-.41,6l51.44,51.44a8.19,8.19,0,0,1,.6,11.09,8,8,0,0,1-11.71.43l-53-53a4,4,0,0,0-6.44,1.09,16,16,0,0,0,3.12,18.22L142.4,213.66a8,8,0,0,0,5.66,2.34H224a16,16,0,0,0,16-16V180.94A15.92,15.92,0,0,0,231.16,166.63Z"/>'
    },
    sleep: {
      regular: '<path d="M108.11,28.11A96.09,96.09,0,0,0,227.89,147.89,96,96,0,1,1,108.11,28.11Z" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="16"/>',
      fill:    '<path fill="currentColor" d="M235.54,150.21a104.84,104.84,0,0,1-37,52.91A104,104,0,0,1,32,120,103.09,103.09,0,0,1,52.88,57.48a104.84,104.84,0,0,1,52.91-37,8,8,0,0,1,10,10,88.08,88.08,0,0,0,109.8,109.8,8,8,0,0,1,10,10Z"/>'
    },
    me: {
      regular: '<circle cx="128" cy="96" r="64" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="16"/><path d="M32,216c19.37-33.47,54.55-56,96-56s76.63,22.53,96,56" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="16"/>',
      fill:    '<path fill="currentColor" d="M230.93,220a8,8,0,0,1-6.93,4H32a8,8,0,0,1-6.92-12c15.23-26.33,38.7-45.21,66.09-54.16a72,72,0,1,1,73.66,0c27.39,8.95,50.86,27.83,66.09,54.16A8,8,0,0,1,230.93,220Z"/>'
    }
  };

  const TABS = [
    { id: 'health',   label: 'Health'   },
    { id: 'activity', label: 'Activity' },
    { id: 'sleep',    label: 'Sleep'    },
    { id: 'me',       label: 'Me'       }
  ];

  const nav   = document.querySelector('.pebble-nav');
  const title = document.getElementById('screen-title');
  let active  = 'health';

  function glyph(id, isActive){
    return '<svg class="icon" width="24" height="24" viewBox="0 0 256 256" aria-hidden="true" focusable="false">'
      + ICONS[id][isActive ? 'fill' : 'regular'] + '</svg>';
  }

  function render(){
    nav.innerHTML = TABS.map(function(tab){
      const on = tab.id === active;
      return '<button type="button" class="pebble-tab" data-id="' + tab.id + '"'
        + (on ? ' aria-current="page"' : '')
        + ' tabindex="' + (on ? '0' : '-1') + '">'
        + glyph(tab.id, on)
        + '<span class="label">' + tab.label + '</span>'
        + '</button>';
    }).join('');
    title.textContent = TABS.find(function(t){ return t.id === active; }).label;
  }

  function select(id, refocus){
    if (id === active) return;
    active = id;
    render();
    if (refocus) nav.querySelector('[aria-current="page"]').focus();
    // Hook up routing here: navigate(id)
  }

  nav.addEventListener('click', function(e){
    const btn = e.target.closest('.pebble-tab');
    if (btn) select(btn.dataset.id, false);
  });

  // Arrow keys move between tabs, as in a native tab bar. The AI unit is not
  // part of this loop — it's an action outside the nav, reached with Tab.
  nav.addEventListener('keydown', function(e){
    const dir = e.key === 'ArrowRight' ? 1 : e.key === 'ArrowLeft' ? -1 : 0;
    if (!dir) return;
    e.preventDefault();
    const i = TABS.findIndex(function(t){ return t.id === active; });
    select(TABS[(i + dir + TABS.length) % TABS.length].id, true);
  });

  // The AI unit opens chat over the current tab — it never changes the
  // selected tab. Wire it up here: openChat()
  document.querySelector('.pebble-ai').addEventListener('click', function(){
    /* openChat(); */
  });

  render();
</script>
</body>
</html>
